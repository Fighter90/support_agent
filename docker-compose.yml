services:
  app:
    build: .
    image: softline-support-agent:latest
    container_name: support-agent
    restart: always
    env_file: .env
    environment:
      DATA_DIR: /app/data
      TZ: Europe/Moscow
    volumes:
      - ./data/runtime:/app/data
      - ./data/kb:/app/data/kb:ro
    expose:
      - "8000"
    mem_limit: 2g

  caddy:
    image: caddy:2-alpine
    container_name: support-agent-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
